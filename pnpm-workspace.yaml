packages:
  - packages/*
catalog:
  # Shared client build + UI runtime. React is the host-provided platform
  # module; pin it to the 18.3.1 line the DSH 0.2.2 web shell ships.
  '@base-ui/react': ^1.9.0
  '@storybook/react-vite': ^10.6.7
  '@tailwindcss/vite': ^4.3.5
  '@types/node': ^24.10.1
  '@types/react': ^18.3.31
  '@types/react-dom': ^18.3.7
  class-variance-authority: ^0.7.1
  esbuild: ^0.28.2
  clsx: ^2.1.1
  jsdom: ^31.0.1
  lucide-react: ^1.73.0
  react: 18.3.1
  react-dom: 18.3.1
  react-test-renderer: 18.3.1
  storybook: ^10.6.7
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.5
  tsdown: ^0.23.0
  typescript: ^7.0.2
  vite: ^7.3.7
  # Quality gates. Exact versions, never `latest`: these tools decide whether a
  # change passes, so a floating range would silently change the standard mid
  # review. Upgrades are explicit commits that audit newly added rules.
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  oxfmt: 0.78.0
  fallow: 3.43.1
  # DSH 0.2.2-rc.1 baseline. Dev dependencies stay exact so typechecking and
  # smoke tests see the runtime the pinned host actually installs; published
  # peerDependencies keep their compatible ranges.
  '@deepseek-ai/cordis': 4.1.0
  '@deepseek-ai/schemastery': 3.19.0
  '@deepseek-ai/dsh-agent': 0.2.2-rc.1
  '@deepseek-ai/dsh-api-session-controller': 0.2.2-rc.1
  '@deepseek-ai/dsh-atomic-write': 0.2.2-rc.1
  '@deepseek-ai/dsh-attachment': 0.2.2-rc.1
  '@deepseek-ai/dsh-authorization': 0.2.2-rc.1
  '@deepseek-ai/dsh-bash-local': 0.2.2-rc.1
  '@deepseek-ai/dsh-bash-sandbox': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-connection': 0.2.2-rc.1
  # Deliberate, pinned host coupling: the DSH web shell exposes this module in
  # its frozen table, and the jj-workspace worktree option reuses it. It is not
  # a supported third-party SDK; see docs/client-ui-migration.md before bumping.
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.2-rc.1
  '@deepseek-ai/dsh-commands': 0.2.2-rc.1
  '@deepseek-ai/dsh-credentials': 0.2.2-rc.1
  '@deepseek-ai/dsh-experimental-worktree': 0.2.2-rc.1
  '@deepseek-ai/dsh-fs': 0.2.2-rc.1
  '@deepseek-ai/dsh-fs-local': 0.2.2-rc.1
  '@deepseek-ai/dsh-home-paths': 0.2.2-rc.1
  '@deepseek-ai/dsh-host-webserver': 0.2.2-rc.1
  '@deepseek-ai/dsh-llm': 0.2.2-rc.1
  '@deepseek-ai/dsh-llm-pi-ai': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox-local': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox-policy': 0.2.2-rc.1
  '@deepseek-ai/dsh-session': 0.2.2-rc.1
  '@deepseek-ai/dsh-session-query': 0.2.2-rc.1
  '@deepseek-ai/dsh-session-title': 0.2.2-rc.1
  '@deepseek-ai/dsh-settings': 0.2.2-rc.1
  '@deepseek-ai/dsh-shell': 0.2.2-rc.1
  '@deepseek-ai/dsh-shell-env': 0.2.2-rc.1
  '@deepseek-ai/dsh-skill': 0.2.2-rc.1
  '@deepseek-ai/dsh-skill-filesystem': 0.2.2-rc.1
  '@deepseek-ai/dsh-spill': 0.2.2-rc.1
  '@deepseek-ai/dsh-storage': 0.2.2-rc.1
  '@deepseek-ai/dsh-storage-domain': 0.2.2-rc.1
  '@deepseek-ai/dsh-subagent': 0.2.2-rc.1
  '@deepseek-ai/dsh-subprocess': 0.2.2-rc.1
  '@deepseek-ai/dsh-system-prompt': 0.2.2-rc.1
  '@deepseek-ai/dsh-timeout': 0.2.2-rc.1
  '@deepseek-ai/dsh-tools': 0.2.2-rc.1
  '@deepseek-ai/dsh-user-approval': 0.2.2-rc.1
  '@deepseek-ai/dsh-user-questions': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-values': 0.2.2-rc.1
  '@deepseek-ai/dsh-working-directory': 0.2.2-rc.1
  '@deepseek-ai/dsh-workspace': 0.2.2-rc.1
  # Preview/test graph of the pinned host primitives package. That package ships
  # only `lib/` and lists its runtime imports as devDependencies in its own
  # manifest, so Storybook and the jsdom tests must supply them. Versions follow
  # the 0.2.2-rc.1 primitives manifest; production never loads these directly.
  '@deepseek-ai/dsh-client-store': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-code-language': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-file-drag': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-workspace-path': 0.2.2-rc.1
  '@shikijs/langs': ^4.4.3
  '@types/mdast': ^4.0.4
  anser: ^2.3.5
  diff: ^9.0.0
  katex: ^0.18.7
  mdast-util-from-markdown: ^2.0.3
  mdast-util-gfm: ^3.1.0
  mdast-util-math: ^3.0.0
  micromark-core-commonmark: ^2.0.3
  micromark-extension-gfm: ^3.0.0
  micromark-extension-math: ^3.1.0
  micromark-factory-space: ^2.0.1
  micromark-util-character: ^2.1.1
  micromark-util-classify-character: ^2.0.1
  micromark-util-decode-string: ^2.0.1
  micromark-util-sanitize-uri: ^2.0.1
  micromark-util-symbol: ^2.0.1
  micromark-util-types: ^2.0.2
  shiki: ^4.4.3
  simple-icons: 16.31.0
  immer: ^10.1.1
  js-yaml: ^4.3.2
  zustand: ~4.5.7
allowBuilds:
  # Transitive deps of @earendil-works/pi-ai (local typecheck/smoke only);
  # neither install script is needed at runtime.
  '@google/genai': false
  esbuild: true
  koffi: true
  protobufjs: false
nodeLinker: hoisted
