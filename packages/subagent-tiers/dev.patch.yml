# Development / deployment overlay: the locally built plugin entry, by
# absolute path. For the two flows that mount entries directly instead of
# installing the bundle:
#
#   - dev:    dsh --profile web --patch ./packages/subagent-tiers/dev.patch.yml \
#               --no-open --port <port>
#   - deploy: the NixOS dsh module's programs.dsh.plugins (absolute-path name,
#             see ~/.config/nixos/home/ai/dsh/plugins.nix)
#
# 记得同时 disable stock 的 tool-subagent 行,否则 preset 实例与本插件注册的
# `subagent` 工具重名。Rebuild 先行(pnpm build),路径保持带引号的字符串。
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true

- insert:
    - id: subagent-tiers
      name: '/home/sikongjueluo/Projects/dsh-extensions/packages/subagent-tiers/lib/index.js'
