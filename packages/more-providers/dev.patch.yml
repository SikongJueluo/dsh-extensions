# Development overlay: the locally built plugin entry, by absolute path.
# Rebuild first (`pnpm build`) so lib/ is current, then restart dsh:
#   dsh --profile web --patch $PWD/packages/more-providers/dev.patch.yml \
#     --no-open --port <port>
# `--patch` is a global flag used with `--profile`; the `web` subcommand does
# not accept it. Paths must stay quoted strings so rebuilds are seen.
- insert:
    - id: more-providers
      name: '/home/sikongjueluo/Projects/dsh-extensions/packages/more-providers/lib/index.js'
