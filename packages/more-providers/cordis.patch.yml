# dsh-more-providers bundle layer: the YAML-driven provider registry.
#
# It owns every API-key LLM route, so the stock pi-ai adapter row is disabled
# to avoid a second provider directory and duplicate-route conflicts. ChatGPT
# OAuth stays with dsh-oauth-providers; deepseek-official stays with the stock
# DeepSeek adapter. Provider definitions live in $DSH_HOME/more-providers.yaml.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  disabled: true

- insert:
    - id: more-providers
      name: dsh-more-providers
