defaults:
  filter:
    exclude:
      - { match: '-(free|preview)$' }
  modelDefaults:
    - { match: '-sol$', contextWindow: 500000 }

providers:
  zai-coding-cn:
    kind: builtin
    secretName: zhipu-coding-api-key

  opencode-go:
    kind: builtin
    secretName: opencode-api-key

  moonshotai:
    kind: builtin
    secretName: moonshot-api-key

  minimax:
    kind: builtin
    secretName: minimax-coding-api-key

  command-code:
    kind: command-code
    displayName: Command Code
    secretName: commandcode-api-key

  mdkj:
    kind: custom
    displayName: MDKJ
    api: openai-responses
    baseURL: https://mdkj.lol/v1
    modelsURL: https://mdkj.lol/v1/models
    models:
      - id: gpt-6.1-sol
        name: GPT-6.1 Sol
        contextWindow: 500000
        maxTokens: 32768
        input: [text, image]
    modelDefaults:
      - match: '-sol$'
        contextWindow: 500000
    filter:
      include:
        - { match: '-(astra|sol|terra)$' }
      exclude:
        - { match: '-terra$' }
    accounts:
      stable:
        displayName: MDKJ Stable
        secretName: mdkj-stable-gpt-api-key
      cheap:
        displayName: MDKJ Cheap
        secretName: mdkj-cheap-gpt-api-key

  chatgpt:
    kind: chatgpt
