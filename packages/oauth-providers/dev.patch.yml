# Development overlay: the authorization seam plus the locally built plugin
# entry, by absolute path / package name. Rebuild first (`pnpm build`) so
# lib/ is current. Use with the global flag, e.g.
#   dsh --profile web --patch ./packages/oauth-providers/dev.patch.yml --no-open --port <port>
# (the `web` subcommand takes no parent flags; `--profile web` does).
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: oauth-providers
      name: '/home/sikongjueluo/Projects/dsh-extensions/packages/oauth-providers/lib/index.js'
