# dsh-oauth-providers bundle layer.
#
# The `oauth-providers` plugin: one LLM route per OAuth-authenticated provider
# module (today: the ChatGPT subscription on route `chatgpt`). The harness
# authorization seam is already provided by dsh-base; inserting it here again
# would duplicate the row id.
#
# Users can override the row later by id in a later patch layer — a patch
# replaces the row's whole `config`.
- insert:
    - id: oauth-providers
      name: dsh-oauth-providers
