# Development / deployment overlay: the locally built plugin entry, by
# absolute path. Equivalent to the bundle layer in cordis.patch.yml, for the
# two flows that mount entries directly instead of installing the bundle:
#
#   - dev:    dsh --profile web --patch ./packages/remote-exec/dev.patch.yml \
#               --no-open --port <port>
#   - deploy: the NixOS dsh module's programs.dsh.extraPatches (see
#             ~/.config/nixos/home/ai/dsh/plugins.nix)
#
# Rebuild first (`pnpm build`) so lib/ is current, then restart dsh. Paths
# must stay quoted strings: a bare path literal would be copied into the Nix
# store at eval time and later rebuilds would never be seen.
#
# Add real targets under `config.targets` here (see README for the schema).
- id: remote-exec
  name: '/home/sikongjueluo/Projects/dsh-extensions/packages/remote-exec/lib/index.js'
