# dsh-crew bundle layer.
#
# 固定路由的委派工具组(quick/workhorse/smart 三档 + create_agent 常驻角色
# 代理),档位语义写进各自的工具 description(选型时最强的信号),路由由插件
# Config 钉死,模型只能"选档位",不能选模型。路由默认值在 src/index.ts 的
# Config 里;要覆盖就以后层 patch 按 id 改写整个 config(或直接改默认值)。
#
# 按行 id 关闭 stock 委派行:宿主把它们放在顶层还是 preset 的 delegation
# 组内都能命中。保留 tool-subagent-control(send_message / interrupt_agent /
# list_agents 是 crew 的配套控制面)。
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  disabled: true
- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
  disabled: true
- insert:
    - id: crew
      name: dsh-crew
