# Development / deployment overlay: the locally built plugin entry, by
# absolute path. Equivalent to the bundle layer above for the flows that mount
# entries directly instead of installing the bundle:
#
#   - dev:    dsh --profile web --patch ./packages/session-write-access/dev.patch.yml \
#               --no-open --port <port>
#   - deploy: the NixOS dsh module's programs.dsh.extraPatches
#
# Rebuild first (`pnpm build`) so lib/ is current, then restart dsh. Paths must
# stay quoted strings: a bare path literal would be copied into the Nix store
# at eval time and later rebuilds would never be seen.
#
# `protectPluginCode: false` is DEV-ONLY: this checkout is commonly the
# session's own workspace, so protecting the package directory would refuse
# every call. A production deployment must keep the default (true) and run
# sessions from a project directory separated from this source tree.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  disabled: true

- insert:
    - id: session-write-access
      name: '/home/sikongjueluo/Projects/dsh-extensions/packages/session-write-access/lib/index.js'
      config:
        mode: workspace-write
        additionalWritableRoots: []
        protectPluginCode: false
